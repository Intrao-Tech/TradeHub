services:
  postgres:
    image: postgres:16-alpine
    container_name: tradehub-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: tradehub
      POSTGRES_PASSWORD: tradehub_dev
      POSTGRES_DB: tradehub
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tradehub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
